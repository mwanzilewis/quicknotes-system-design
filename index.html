<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>
    <button id="load-btn">Load notes</button>
    <p id="status" role="status"></p>

    <form id="note-form">
      <label for="title-input">Title</label>
      <input id="title-input" type="text" maxlength="100" required>

      <label for="body-input">Body</label>
      <textarea id="body-input"></textarea>

      <button id="submit-btn" type="submit">Create note</button>
    </form>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
